name: Bug report
description: Report a reproducible non-security bug in AstraeaOS WP
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Follow SECURITY.md and use private vulnerability reporting if enabled.
  - type: input
    id: version
    attributes:
      label: AstraeaOS WP version
      placeholder: 0.6.0-alpha
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, database, web server, browser and relevant plugins/themes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
