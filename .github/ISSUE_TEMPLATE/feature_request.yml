name: Feature request
description: Suggest an AstraeaOS WP infrastructure feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the infrastructure problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: plugin_replacement
    attributes:
      label: Existing plugin/dependency this could replace (optional)
  - type: textarea
    id: security
    attributes:
      label: Security/compatibility considerations
